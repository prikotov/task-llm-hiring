parameters:
    env(DATABASE_URL): 'postgresql://app:app@127.0.0.1:5544/app?serverVersion=17&charset=utf8'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '17'
    orm:
        auto_generate_proxy_classes: false
        proxy_dir: '%kernel.build_dir%/doctrine/orm/Proxies'
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        auto_mapping: true
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App
