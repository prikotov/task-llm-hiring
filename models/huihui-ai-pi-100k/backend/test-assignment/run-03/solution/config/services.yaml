services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Domain/'
            - '../src/Persistence/Entity/'
            - '../src/Persistence/Enum/'
            - '../src/Persistence/Migration/'

    # Доменные примитивы — без автоинжекта (чистые классы).
    App\Domain\Pricing\CostCalculator:
        public: true

    App\Application\Billing\ReportBuilder:
        public: true
