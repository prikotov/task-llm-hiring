parameters:
    env(DATABASE_URL): 'postgresql://app:app@127.0.0.1:5544/app?serverVersion=17&charset=utf8'
    # Тестовая база — отдельная переменная, т.к. dotenv не перезаписывает
    # DATABASE_URL из .env при загрузке .env.test (приоритет ранее загруженного .env).
    env(TEST_DATABASE_URL): 'postgresql://app:app@127.0.0.1:5544/app_test?serverVersion=17&charset=utf8'

doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        server_version: '17'
    orm:
        auto_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        controller_resolver:
            auto_mapping: false
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src'
                prefix: 'App'
                alias: App

when@test:
    doctrine:
        dbal:
            # Отдельная тестовая БД (TEST_DATABASE_URL в .env.test).
            # Не переопределяем DATABASE_URL из .env, т.к. dotenv не перезаписывает
            # переменные, заданные ранее загруженным .env (приоритет .env выше .env.test).
            url: '%env(resolve:TEST_DATABASE_URL)%'
